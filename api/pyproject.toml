[project]
name = "lowcy-api"
version = "0.1.0"
description = "Łowcy Historii API (FastAPI modular monolith)"
authors = [
    {name = "Oleg",email = "olafieros@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "redis (>=5.2,<6)",
    "arq (>=0.28.0,<0.29.0)",
    "boto3 (>=1.43.111,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "sqladmin (>=0.32.0,<0.33.0)"
]


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "types-boto3[s3] (>=1.43.111,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
# The alembic/ folder shadows the package name; keep it as third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
